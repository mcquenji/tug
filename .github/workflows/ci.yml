name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-fvm
      - name: Analyze and test
        shell: bash
        run: |
          fvm dart analyze --fatal-infos
          fvm dart test
          python -m unittest discover -s tool/release_tests
      - name: Verify generated files
        if: matrix.target == 'linux-x64'
        shell: bash
        run: fvm dart run tool/generate.dart --check
      - name: Compile and smoke-test the native CLI
        shell: bash
        run: |
          fvm dart run tool/build.dart
          python tool/release.py package --target '${{ matrix.target }}'
